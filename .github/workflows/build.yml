name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version build phase uses `git describe` and the commit count

      # Ad-hoc signed so no secrets are needed (also works for PRs from forks).
      # Tests that need a local gopass/gpg password store are skipped.
      - name: Test
        run: |
          xcodebuild test \
            -project passx.xcodeproj \
            -scheme passx \
            -destination 'platform=macOS' \
            -only-testing:passxTests \
            -skip-testing:passxTests/GoPassWrapperTests/testGoPassLogin \
            -skip-testing:passxTests/GoPassWrapperTests/testGoPassQuery \
            -skip-testing:passxTests/GoPassWrapperTests/testGoPassQueryHost \
            -skip-testing:passxTests/GpgPassTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

  dmg:
    name: Build DMG
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write # to create a release for tags
    env:
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # From https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Install the Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          # Allow codesign to use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Only sign with Developer ID if the secret actually holds a valid (unexpired) Developer ID identity
          IDENTITIES=$(security find-identity -v -p codesigning $KEYCHAIN_PATH)
          if echo "$IDENTITIES" | grep -q '"Developer ID Application'; then
            echo "SIGN_IDENTITY=Developer ID Application" >> $GITHUB_ENV
          else
            ALL=$(security find-identity -p codesigning $KEYCHAIN_PATH | grep '"' | sed 's/^ *[0-9]*) [0-9A-F]* //' | tr '\n' ' ')
            echo "::warning title=No valid Developer ID certificate::BUILD_CERTIFICATE_BASE64 contains: ${ALL:-no identities}. Building ad-hoc signed DMG instead."
          fi

      # Signs with Developer ID when the certificate was installed (ad-hoc otherwise),
      # and notarizes when the NOTARY_* secrets are set
      - name: Build DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          # Repeat errors as annotations, which are visible without access to the logs
          if ! scripts/build-dmg.sh 2>&1 | tee build-dmg.log; then
            grep -E 'error:|\*\* BUILD FAILED' build-dmg.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi
          echo "DMG=$(ls build/passx-*.dmg)" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: passx-dmg
          path: ${{ env.DMG }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG" --generate-notes
